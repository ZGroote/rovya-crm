<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rovya">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="img/favicon.png">
<title>Rovya · Entrar</title>
<meta name="theme-color" content="#0b0607">
<link rel="preload" as="image" href="img/login-rosa-calma.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* login "Onda B (Véu)": a rosa na água; ao entrar, a pétala cai e a luz se abre (o app.html começa com a mesma luz) */
:root{
  --bg:#0b0607; --ink:#f6eee6; --mute:#bcaa9e; --gold:#d4ad6e; --gold-2:#f0d6a4; --wine:#8e0f1d; --err:#f08a93;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:300 15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}

.palco{position:fixed;inset:0;overflow:hidden;overflow:clip;isolation:isolate} /* clip: o foco no campo não rola a cena para o lado */
.camera{position:absolute;inset:-2%;z-index:-3;transform:translate3d(calc(var(--mx,0)*-10px),calc(var(--my,0)*-6px),0);transition:transform 1.4s var(--ease)}
.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;background:var(--bg)}
#calma{animation:respira 2.6s var(--ease) both}
#petala{opacity:0;transition:opacity .35s}
@keyframes respira{from{scale:1.1;filter:brightness(.3) blur(6px)}to{scale:1;filter:none}}
.vinheta{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 70% 80% at 50% 38%,transparent 40%,rgba(8,4,5,.55) 100%),
             linear-gradient(0deg,rgba(8,4,5,.75) 0%,transparent 34%),
             linear-gradient(180deg,rgba(8,4,5,.55) 0%,transparent 14%)}
/* brilhos dourados desenhados em código: nunca repetem, então o loop do vídeo não aparece */
.poeira{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;mix-blend-mode:screen}
.nevoa{position:absolute;z-index:-2;left:-30%;right:-30%;bottom:18%;height:30%;pointer-events:none;opacity:.28;filter:blur(30px);mix-blend-mode:screen;
  background:radial-gradient(ellipse 22% 38% at 20% 60%,rgba(220,200,185,.5),transparent 70%),
             radial-gradient(ellipse 18% 30% at 58% 50%,rgba(220,200,185,.4),transparent 70%),
             radial-gradient(ellipse 25% 36% at 88% 62%,rgba(220,200,185,.45),transparent 70%);
  animation:nevoa 53s linear infinite alternate}
@keyframes nevoa{from{translate:-8% 0}to{translate:8% 0}}

.topo{position:absolute;z-index:4;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px clamp(20px,5vw,72px)}
.marca{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.marca img{height:34px}
.marca b{display:block;font:500 .82rem/1 Inter;letter-spacing:.42em}
.marca small{display:block;margin-top:4px;font:400 .62rem/1 Inter;letter-spacing:.5em;color:var(--gold)}
.data{margin:0;font:italic 400 1.05rem 'Cormorant Garamond',serif;color:var(--mute)}
.data b{font-style:normal;font-weight:500;color:var(--gold-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.barra{position:absolute;z-index:5;left:50%;bottom:clamp(20px,5vh,56px);width:min(720px,calc(100vw - 40px));translate:-50% 0;
  padding:18px 18px 12px 22px;border-radius:26px;background:rgba(22,9,12,.5);
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 30px 70px -24px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,240,215,.07)}
.barra::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(100deg,rgba(240,214,164,.5),rgba(212,173,110,.08) 35%,rgba(212,173,110,.08) 70%,rgba(142,15,29,.65));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
form{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:14px}
form.um{grid-template-columns:1fr auto}   /* código do autenticador ou nova senha: um campo só */
label{display:block;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.campo{position:relative;margin-top:7px}
input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid rgba(212,173,110,.2);background:rgba(8,4,5,.5);
  color:var(--ink);font:400 .95rem Inter;outline:none;transition:border-color .3s,box-shadow .3s,background .3s}
input::placeholder{color:#7a6a61}
input:focus{border-color:var(--gold);background:rgba(8,4,5,.7);box-shadow:0 0 0 4px rgba(212,173,110,.13)}
.olho{position:absolute;right:6px;top:50%;translate:0 -50%;border:0;background:none;color:var(--mute);cursor:pointer;padding:8px;font:500 .64rem Inter;letter-spacing:.12em}
.olho:hover,.olho:focus-visible{color:var(--gold-2);outline:none}
.entrar{display:flex;align-items:center;gap:14px;padding:6px 6px 6px 22px;border:0;border-radius:99px;cursor:pointer;white-space:nowrap;
  color:#1a0b0d;background:linear-gradient(135deg,var(--gold-2),var(--gold));font:500 .78rem Inter;letter-spacing:.24em;text-transform:uppercase;
  box-shadow:0 14px 30px -12px rgba(212,173,110,.6);transition:transform .4s var(--ease),box-shadow .4s}
.entrar i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#1a0b0d;color:var(--gold-2);font-style:normal;transition:transform .45s var(--ease)}
.entrar:hover{transform:translateY(-2px);box-shadow:0 20px 38px -12px rgba(212,173,110,.75)}
.entrar:hover i{transform:rotate(-45deg)}
.entrar:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.entrar[disabled]{opacity:.6;cursor:progress}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(212,173,110,.12);font-size:.76rem;color:var(--mute)}
.rodape .msg{flex:1;margin:0;color:var(--err)}
.rodape .msg.ok{color:var(--gold-2)}
.esqueci{color:var(--mute);text-decoration:none;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.esqueci:hover,.esqueci:focus-visible{color:var(--gold-2);border-color:var(--gold-2);outline:none}

.topo,.barra{opacity:0;animation:entra 1.1s var(--ease) forwards}
.topo{animation-delay:.6s}.barra{animation-delay:1.25s}
@keyframes entra{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
/* erro: o formulário balança (no form, para não trocar a animação de entrada da barra) */
.trancada #f{animation:treme .45s}
@keyframes treme{20%{translate:-10px 0}45%{translate:8px 0}70%{translate:-4px 0}}

/* saída: some a interface, a pétala cai, a luz se abre como um véu */
.saindo .topo,.saindo .barra,.saindo .poeira,.saindo .nevoa{opacity:0!important;filter:blur(6px);transition:opacity .5s,filter .5s;animation:none}
.saindo .camera{transform:none}
.saindo #petala{opacity:1}
.luz{position:fixed;inset:0;z-index:21;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,#fff3df,#e9d7bd 40%,#0b0607 100%)}
.luz.acesa{opacity:1;transition:opacity .6s ease}
#onda{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}

/* celular: tela fixa. Rosa em cima, formulário compacto embaixo */
@media (max-width:860px){
  .palco{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;height:100svh;
    padding:0 22px calc(clamp(30px,6svh,56px) + env(safe-area-inset-bottom))}
  .camera{inset:auto 0;top:34px;height:60svh;-webkit-mask:linear-gradient(transparent,#000 12%);mask:linear-gradient(transparent,#000 12%)}
  .camera video{object-position:50% 30%}
  .vinheta{background:linear-gradient(0deg,var(--bg) 40%,rgba(11,6,7,.35) 58%,transparent 70%),linear-gradient(180deg,rgba(8,4,5,.6),transparent 14%)}
  .topo{padding:16px 18px}
  .marca img{height:28px}
  .data{display:none}
  .barra{grid-row:2;grid-column:1/3;position:relative;left:auto;bottom:auto;translate:none;width:auto;padding:14px 14px 10px;border-radius:22px}
  form,form.um{grid-template-columns:1fr;gap:9px}
  .campo{margin-top:5px}
  input{padding:11px 13px;font-size:16px}  /* 16px: o iPhone não dá zoom ao tocar no campo */
  .entrar{justify-content:space-between;margin-top:3px}
  .entrar i{width:34px;height:34px}
  .rodape{margin-top:9px;padding-top:8px;gap:10px}
  .rodape .msg:empty{display:none}
  .rodape .msg{position:absolute;left:14px;right:14px;bottom:100%;margin-bottom:6px;text-align:center}
}
@media (max-width:860px) and (max-height:640px){ .camera{height:56svh} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<main class="palco" id="palco">
  <div class="camera" aria-hidden="true">
    <video id="calma" autoplay muted loop playsinline preload="auto" poster="img/login-rosa-calma.webp">
      <source src="img/login-rosa-calma.webm" type="video/webm"><source src="img/login-rosa-calma.mp4" type="video/mp4"></video>
    <video id="petala" muted playsinline preload="none">
      <source src="img/login-rosa-petala.webm" type="video/webm"><source src="img/login-rosa-petala.mp4" type="video/mp4"></video>
  </div>
  <div class="nevoa" aria-hidden="true"></div>
  <canvas class="poeira" id="brilhos" aria-hidden="true"></canvas>
  <div class="vinheta" aria-hidden="true"></div>

  <header class="topo">
    <span class="marca"><img src="img/rosa.svg" alt=""><span><b>ROVYA</b><small>CREATIVE</small></span></span>
    <p class="data" id="data"></p>
  </header>

  <h1 class="sr" id="titulo">Rovya · Entrar</h1>

  <section class="barra" aria-labelledby="titulo">
    <form id="f" novalidate>
      <label id="lEmail">E-mail<div class="campo"><input id="email" type="email" autocomplete="username" placeholder="seu@email.com" required></div></label>
      <label id="lSenha"><span id="tSenha">Senha</span><div class="campo"><input id="senha" type="password" autocomplete="current-password" placeholder="••••••••" required><button type="button" class="olho" id="olho" aria-label="Mostrar senha">VER</button></div></label>
      <button class="entrar" id="b"><span id="tb">Entrar</span> <i aria-hidden="true">→</i></button>
    </form>
    <div class="rodape">
      <p class="msg" id="msg" role="alert"></p>
      <a class="esqueci" href="#" id="esqueci">Esqueci a senha</a>
    </div>
  </section>
</main>
<canvas id="onda" aria-hidden="true"></canvas>
<div class="luz" aria-hidden="true"></div>
<script>
// guarda antes do Supabase limpar a URL: veio do e-mail de "esqueci minha senha"?
window.veioRecuperar = /[?&]recuperar=1/.test(location.search) || /type=recovery/.test(location.hash);
</script>
<script type="module">
import { sb } from './config.js';
const $=id=>document.getElementById(id), espera=ms=>new Promise(r=>setTimeout(r,ms));
const reduzido=matchMedia('(prefers-reduced-motion: reduce)').matches;
let recuperando=false, pedindoCodigo=false;

$('data').innerHTML=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}).replace(/^(\S+)/,'<b>$1</b>');
// leve: o vídeo da pétala (a saída) só baixa quando ela toca no formulário
$('f').addEventListener('focusin',()=>{ const p=$('petala'); p.preload='auto'; p.load(); },{once:true});
$('olho').onclick=()=>{const s=$('senha'),v=s.type==='password';s.type=v?'text':'password';$('olho').textContent=v?'OCULTAR':'VER';$('olho').setAttribute('aria-label',v?'Ocultar senha':'Mostrar senha')};
if(!reduzido&&matchMedia('(pointer:fine)').matches){
  addEventListener('pointermove',e=>{const p=$('palco').style;p.setProperty('--mx',(e.clientX/innerWidth-.5).toFixed(3));p.setProperty('--my',(e.clientY/innerHeight-.5).toFixed(3))});
}

/* ---------- brilhos dourados que sobem e cintilam ---------- */
(()=>{
  if(reduzido) return;
  const c=$('brilhos'), x=c.getContext('2d'); let W,H,dpr,ps=[],ultimo=0;
  const novo=baixo=>({x:Math.random(),y:baixo?1.05:Math.random(),r:2+Math.random()*Math.random()*14,v:.006+Math.random()*.018,
    d:(Math.random()-.5)*.01,f:Math.random()*6.28,fv:.6+Math.random()*1.6,a:.25+Math.random()*.5});
  const medir=()=>{dpr=Math.min(devicePixelRatio||1,2);W=c.width=c.clientWidth*dpr;H=c.height=c.clientHeight*dpr;
    const n=Math.round(Math.min(46,W*H/(dpr*dpr)/26000)); while(ps.length<n)ps.push(novo(false)); ps.length=n;};
  medir(); addEventListener('resize',medir);
  const quadro=t=>{
    const dt=Math.min(.05,(t-ultimo)/1000||0); ultimo=t; x.clearRect(0,0,W,H);
    for(const p of ps){
      p.y-=p.v*dt; p.x+=p.d*dt; p.f+=p.fv*dt;
      if(p.y<-.05) Object.assign(p,novo(true));
      const a=p.a*(.55+.45*Math.sin(p.f))*Math.min(1,(1.05-p.y)*4), R=p.r*dpr, px=p.x*W, py=p.y*H;
      const g=x.createRadialGradient(px,py,0,px,py,R); g.addColorStop(0,`rgba(255,226,170,${a})`); g.addColorStop(.45,`rgba(240,200,130,${a*.45})`); g.addColorStop(1,'rgba(240,200,130,0)');
      x.fillStyle=g; x.beginPath(); x.arc(px,py,R,0,6.283); x.fill();
    }
    if(!document.body.classList.contains('saindo')) requestAnimationFrame(quadro);
  };
  requestAnimationFrame(quadro);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) ultimo=performance.now(); });
})();

/* ---------- saída: a pétala cai na água e a luz se abre (véu) ---------- */
const BATE=3.4;          // segundo do login-rosa-petala em que a pétala toca a água
const VELOCIDADE=1.35;   // a queda roda um pouco acelerada
const TOQUE={x:.5,y:.75};// onde a pétala toca a água, no quadro do vídeo (0 a 1)
function pontoNaTela(v,pt){ // ponto do vídeo (object-fit:cover) → posição na tela
  const r=v.getBoundingClientRect(), W=v.videoWidth||1280, H=v.videoHeight||720;
  const s=Math.max(r.width/W,r.height/H), w=W*s, h=H*s;
  const pos=getComputedStyle(v).objectPosition.split(' ').map(p=>parseFloat(p)/100);
  return {x:r.left+(r.width-w)*pos[0]+pt.x*w, y:r.top+(r.height-h)*pos[1]+pt.y*h};
}
function veu(px,py,D=2300){return new Promise(fim=>{
  const c=$('onda'), x=c.getContext('2d'), luz=document.querySelector('.luz'), dpr=Math.min(devicePixelRatio||1,2);
  const W=innerWidth*dpr, H=innerHeight*dpr, X=px*dpr, Y=py*dpr, M=Math.hypot(Math.max(X,W-X),Math.max(Y,H-Y));
  const t0=performance.now(); let fundiu=false;
  const ease=u=>1-Math.pow(1-u,3), suave=(a,b,u)=>{u=Math.max(0,Math.min(1,(u-a)/(b-a)));return u*u*(3-2*u);};
  const cena=[$('petala'),$('calma')];
  c.width=W; c.height=H;
  (function q(){
    const t=Math.min(1,(performance.now()-t0)/D), e=ease(t), R=e*M*1.4+2, asp=.3+.7*Math.pow(e,1.3), a=suave(.05,.9,t);
    cena.forEach(el=>el.style.filter=`blur(${e*7}px) brightness(${1+e*.35})`);
    x.clearRect(0,0,W,H); x.save(); x.translate(X,Y); x.scale(1,asp);
    const g=x.createRadialGradient(0,0,0,0,0,R);
    g.addColorStop(0,`rgba(255,243,223,${.95*a})`); g.addColorStop(.35,`rgba(245,230,205,${.8*a})`);
    g.addColorStop(.7,`rgba(233,215,189,${.35*a})`); g.addColorStop(1,'rgba(233,215,189,0)');
    x.fillStyle=g; x.beginPath(); x.arc(0,0,R,0,6.2832); x.fill(); x.restore();
    if(t>.72&&!fundiu){fundiu=true;luz.classList.add('acesa');}
    t<1?requestAnimationFrame(q):setTimeout(fim,350);
  })();
});}
async function abrir(){
  if(reduzido){ location.replace('app.html'); return; }
  const calma=$('calma'), pet=$('petala');
  document.body.classList.add('saindo');
  await Promise.race([(async()=>{ // a pétala cai; se o vídeo não tocar (rede ruim, economia de dados) segue só com a luz
    pet.currentTime=0; pet.playbackRate=VELOCIDADE; await pet.play(); calma.pause();
    await new Promise(r=>{const ve=()=>pet.currentTime>=BATE||pet.ended?r():requestAnimationFrame(ve);ve();});
  })(),espera(4500)]).catch(()=>{});
  const p=pontoNaTela(pet,TOQUE);
  await veu(p.x,p.y);
  location.replace('app.html');
}

/* ---------- login de verdade: senha, administradora, código do autenticador, nova senha ---------- */
const avisa=(m,ok)=>{ $('msg').textContent=m; $('msg').classList.toggle('ok',!!ok); };
function tranca(m){ avisa(m); $('b').disabled=false; const b=document.body; b.classList.remove('trancada'); void b.offsetWidth; b.classList.add('trancada'); }
function umCampo(rotulo,botao){ // troca o formulário para um campo só (código ou nova senha)
  $('f').classList.add('um'); $('lEmail').hidden=true; $('esqueci').hidden=true;
  $('tSenha').textContent=rotulo; $('tb').textContent=botao; $('b').disabled=false; avisa('');
  const s=$('senha'); s.value=''; s.focus({preventScroll:true}); return s;
}
// MFA: com fator verificado, a sessão só vale (aal2) depois do código do app autenticador
const precisaCodigo=async()=>{ const { data } = await sb.auth.mfa.getAuthenticatorAssuranceLevel(); return data?.nextLevel==='aal2' && data.currentLevel!=='aal2'; };
function modoCodigo(){
  pedindoCodigo=true; $('olho').hidden=true;
  const s=umCampo('6 dígitos do app autenticador','Confirmar');
  s.type='text'; s.inputMode='numeric'; s.autocomplete='one-time-code'; s.maxLength=6; s.placeholder='000000';
}
function modoNovaSenha(){
  if(recuperando) return; recuperando=true;
  umCampo('Crie uma nova senha','Salvar e entrar').autocomplete='new-password';
}
async function verificarCodigo(code){
  const { data } = await sb.auth.mfa.listFactors();
  const f = data?.totp?.find(x=>x.status==='verified'); if(!f) throw new Error('Nenhum autenticador encontrado.');
  const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: f.id, code });
  if(error) throw new Error('Código incorreto ou vencido. Confira o app e tente de novo.');
}
async function entrar(email,senha){
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error) throw new Error(/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message);
  const { data: admin } = await sb.rpc('is_admin');
  if(!admin){ await sb.auth.signOut(); throw new Error('Este acesso não tem permissão.'); }
}

$('f').addEventListener('submit',async e=>{
  e.preventDefault(); avisa('');
  const email=$('email').value.trim(), senha=$('senha').value;
  $('b').disabled=true;
  try{
    if(pedindoCodigo){
      const code=senha.replace(/\D/g,''); if(code.length!==6) throw new Error('Digite os 6 dígitos.');
      await verificarCodigo(code);
    } else if(recuperando){
      if(senha.length<8) throw new Error('Use pelo menos 8 caracteres.');
      const { error } = await sb.auth.updateUser({ password: senha }); if(error) throw error;
    } else {
      if(!email||!senha) throw new Error('Preencha e-mail e senha.');
      await entrar(email,senha);
      if(await precisaCodigo()){ modoCodigo(); return; }
    }
  }catch(err){ tranca(err.message); return; }
  abrir();
});
$('esqueci').addEventListener('click',async e=>{
  e.preventDefault(); const email=$('email').value.trim();
  if(!email){ avisa('Digite seu e-mail e toque de novo em “Esqueci a senha”.'); $('email').focus(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email,{ redirectTo: location.origin + location.pathname + '?recuperar=1' });
  avisa(error?error.message:'Enviamos um link para o seu e-mail.', !error);
});
// sem internet e com login guardado neste aparelho: vai direto para o CRM (abre com os dados salvos)
try{ if(!navigator.onLine && Object.keys(localStorage).some(k=>/^sb-.+-auth-token$/.test(k))) location.replace('app.html'); }catch(e){}
sb.auth.onAuthStateChange(ev=>{ if(ev==='PASSWORD_RECOVERY') modoNovaSenha(); });
const { data:{ session } } = await sb.auth.getSession();
if(window.veioRecuperar){
  if(session) modoNovaSenha();
  else avisa('Este link expirou ou já foi usado. Peça um novo em “Esqueci a senha”.');
  history.replaceState(null,'',location.pathname); // tira o ?recuperar=1 da barra
} else if(session){ // já tem sessão de administradora: entra direto
  if(await precisaCodigo()) modoCodigo();
  else { const { data: admin } = await sb.rpc('is_admin'); if(admin) location.replace('app.html'); }
}
</script>
</body>
</html>
